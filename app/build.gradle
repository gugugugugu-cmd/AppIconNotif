plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.appiconnotif'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.appiconnotif"
        // libxposed API 102 要求 minSdk 26 (Android 8.0)
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
        debug {
            minifyEnabled false
        }
    }

    // libxposed API 102 入口声明文件, 需要合并打包进 APK 的 META-INF/xposed/ 目录
    packagingOptions {
        resources {
            merges += 'META-INF/xposed/*'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // libxposed 现代 API (LSPosed API 102)
    compileOnly 'io.github.libxposed:api:102.0.0'
    // 模块 App 端与 Xposed 框架通信服务 (用于读写远程配置)
    implementation 'io.github.libxposed:service:102.0.0'

    // Material Design 和 AppCompat 依赖, 用于 Toolbar、CardView 等
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
